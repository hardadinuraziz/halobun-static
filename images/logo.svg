<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 78" width="350" height="78">
  <defs>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>

  <!-- Sprout Leaves -->
  <g transform="translate(15, 3)">
    <!-- Left Leaf -->
    <path d="M 27 19 C 16 15 11 4 21 0 C 27 9 29 15 27 19 Z" fill="#22C55E"/>
    <!-- Right Leaf -->
    <path d="M 29 19 C 39 13 46 2 36 0 C 30 8 28 14 29 19 Z" fill="#15803D"/>
  </g>

  <!-- Chat Bubble Rounded Base -->
  <g transform="translate(4, 22)">
    <rect x="0" y="0" width="52" height="52" rx="15" fill="url(#bubbleGrad)"/>
    <!-- Bubble Pointer (Tail) -->
    <path d="M 10 48 L 15 57 L 23 49 Z" fill="#15803D"/>
    <!-- Contour farm lines in crisp white -->
    <path d="M 10 24 C 20 20 31 26 42 20" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 9 33 C 19 29 33 35 43 28" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 9 42 C 17 37 35 43 43 36" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Brand Typography -->
  <text x="70" y="50" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="#14532D" letter-spacing="-1">Hallobun</text>
  
  <!-- Tagline -->
  <text x="72" y="68" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10" fill="#16A34A" letter-spacing="1.4">LAYANAN PERKEBUNAN &amp; PERTANIAN</text>
</svg>
